# What runs on the VM: the game server and Caddy in front (HTTPS with a free certificate,
# renewed by itself; WebSockets pass through as they are).
# The workflow copies this file, the Caddyfile and .env to /opt/juego on the VM and runs
# `sudo docker compose up -d` there.
#
# .env (written by the workflow from the GitHub variables):
#   IMAGEN          the image in Artifact Registry, with its tag
#   JUEGO_DOMINIO   e.g. juego.example.com, or <ip-with-dashes>.sslip.io without a domain
#   CORS_ORIGIN     the sites that can connect (comma separated)
#   JUEGO_FIREBASE_PROYECTO, JUEGO_MONGO_DB, JUEGO_MONGO_DB_NAME   the accounts (src/juego/servidor/cuentas.ts)
#   JUEGO_APPLE_APP_ID, JUEGO_GOOGLE_CUENTA_SERVICIO   real-money purchases (src/juego/servidor/compras.ts)
#   JUEGO_FCM_CUENTA_SERVICIO   push notifications: friend invites (src/juego/servidor/push.ts)
#   JUEGO_ADMIN_TOKEN   the key of GET /admin/metricas (admin panel → Status, src/juego/servidor/estado.ts)
#   JUEGO_VERSION   the commit of the image (the Status saves it with each match)
#   JUEGO_RTC_IP        the VM's public IP: the WebRTC fast channel announces it (src/juego/servidor/canal.ts)
services:
  juego:
    image: ${IMAGEN}
    restart: unless-stopped
    environment:
      PORT: "3000"
      CORS_ORIGIN: ${CORS_ORIGIN}
      JUEGO_TICK_HZ: ${JUEGO_TICK_HZ:-60}
      JUEGO_ESTADO_HZ: ${JUEGO_ESTADO_HZ:-30}
      JUEGO_MAX_SALAS: ${JUEGO_MAX_SALAS:-50}
      JUEGO_REPETIR_CONTROL: ${JUEGO_REPETIR_CONTROL:-false}
      # Prueba A/B: false dibuja a los demás solo interpolados (sin la proyección al presente)
      JUEGO_PROYECTAR: ${JUEGO_PROYECTAR:-true}
      JUEGO_FIREBASE_PROYECTO: ${JUEGO_FIREBASE_PROYECTO:-}
      JUEGO_MONGO_DB: ${JUEGO_MONGO_DB:-}
      JUEGO_MONGO_DB_NAME: ${JUEGO_MONGO_DB_NAME:-edge_racers}
      JUEGO_APPLE_APP_ID: ${JUEGO_APPLE_APP_ID:-}
      JUEGO_GOOGLE_CUENTA_SERVICIO: ${JUEGO_GOOGLE_CUENTA_SERVICIO:-}
      JUEGO_FCM_CUENTA_SERVICIO: ${JUEGO_FCM_CUENTA_SERVICIO:-}
      JUEGO_ADMIN_TOKEN: ${JUEGO_ADMIN_TOKEN:-}
      # The commit that is running (the deploy writes it): the Status saves it with each match
      JUEGO_VERSION: ${JUEGO_VERSION:-}
      # The WebRTC fast channel (states and controls over UDP): one port for everybody, published
      # as is and open in the firewall (rule juego-rtc); JUEGO_DATACHANNEL=false turns it off
      JUEGO_DATACHANNEL: ${JUEGO_DATACHANNEL:-true}
      JUEGO_RTC_PUERTO: "10000"
      JUEGO_RTC_IP: ${JUEGO_RTC_IP:-}
    expose:
      - "3000"
    ports:
      - "10000:10000/udp"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - juego
    ports:
      - "80:80"
      - "443:443"
    environment:
      JUEGO_DOMINIO: ${JUEGO_DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates survive restarts (Let's Encrypt limits how many you can ask for)
      - caddy_datos:/data
      - caddy_config:/config

volumes:
  caddy_datos:
  caddy_config:
